    <path d="M 28 58 L 28 28 L 58 28"/>
    <path d="M 742 28 L 772 28 L 772 58"/>
    <path d="M 28 462 L 28 492 L 58 492"/>
    <path d="M 742 492 L 772 492 L 772 462"/>
  </g>

  <!-- Top status pill -->
  <rect x="44" y="40" width="220" height="34" rx="17" fill="#059669"/>
