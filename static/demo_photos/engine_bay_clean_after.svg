  <text x="78" y="62" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">ВЫПОЛНЕНО • ПОСЛЕ РЕМОНТА</text>

  <!-- Top right stamp -->
  <text x="756" y="62" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">CheckSTO • Фотофиксация</text>

  <!-- Center schematic illustration -->
  
        <g transform="translate(185, 110)">
          <rect x="40" y="34" width="350" height="90" rx="14" fill="#334155" stroke="#34D399" stroke-width="3"/>
          <rect x="52" y="124" width="326" height="14" rx="4" fill="#10B981"/>
          <rect x="40" y="138" width="350" height="72" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="2.5"/>
          <circle cx="215" cy="126" r="34" fill="#10B981"/>
          <path d="M 201 126 L 211 137 L 231 114" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        

  <!-- Bottom dark info overlay -->
