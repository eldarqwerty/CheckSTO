  <text x="64" y="456" font-family="Inter, Arial, sans-serif" font-size="15" fill="#CBD5E1">Установлена оригинальная прокладка, подтёки масла полностью устранены</text>
  <rect x="612" y="410" width="128" height="32" rx="8" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
  <text x="676" y="431" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#34D399">ГОТОВО ✓</text>
