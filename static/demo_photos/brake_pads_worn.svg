<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#grid)"/>

  <!-- Camera viewfinder brackets -->
  <g stroke="#64748B" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M 28 58 L 28 28 L 58 28"/>
    <path d="M 742 28 L 772 28 L 772 58"/>
    <path d="M 28 462 L 28 492 L 58 492"/>
    <path d="M 742 492 L 772 492 L 772 462"/>
  </g>

  <!-- Top status pill -->
  <rect x="44" y="40" width="220" height="34" rx="17" fill="#DC2626"/>
  <circle cx="64" cy="57" r="5" fill="#FFFFFF"/>
  <text x="78" y="62" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">ДЕФЕКТ • ДО РЕМОНТА</text>

  <!-- Top right stamp -->
  <text x="756" y="62" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">CheckSTO • Фотофиксация</text>

  <!-- Center schematic illustration -->
  
        <g transform="translate(215, 100)">
          <circle cx="185" cy="135" r="105" fill="#334155" stroke="#94A3B8" stroke-width="4"/>
          <circle cx="185" cy="135" r="76" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="10 6"/>
          <circle cx="185" cy="135" r="38" fill="#1E293B" stroke="#94A3B8" stroke-width="3"/>
          <!-- Caliper -->
          <path d="M 250 65 Q 315 135 250 205 L 222 185 Q 268 135 222 85 Z" fill="#475569" stroke="#CBD5E1" stroke-width="2.5"/>
          <!-- Thin worn pad -->
          <rect x="214" y="96" width="8" height="78" rx="3" fill="#EF4444"/>
          <circle cx="222" cy="135" r="46" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="7 5"/>
          <text x="282" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5">Остаток 1.8 мм</text>
          <text x="282" y="148" font-family="Inter, Arial, sans-serif" font-size="12" fill="#94A3B8">Норма: от 3.0 мм</text>
        </g>
        

  <!-- Bottom dark info overlay -->
  <rect x="40" y="388" width="720" height="94" rx="14" fill="#020617" fill-opacity="0.82" stroke="#F87171" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="64" y="424" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Критический износ передних тормозных колодок</text>
  <text x="64" y="456" font-family="Inter, Arial, sans-serif" font-size="15" fill="#CBD5E1">Остаток фрикционного слоя 1.8 мм при минимальной норме 3.0 мм</text>
  <rect x="612" y="410" width="128" height="32" rx="8" fill="#F87171" fill-opacity="0.2" stroke="#F87171" stroke-width="1"/>
  <text x="676" y="431" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171">БЕЗОПАСНОСТЬ</text>
</svg>
